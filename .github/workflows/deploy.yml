name: Deploy Flutter Web to Hostinger

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter build web --release

      - name: Debug - listar archivos locales
        run: ls -la build/web/

      # Sube el contenido de build/web/ a tu hosting via FTP
      - uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: build/web/
          server-dir: landing-flutter/

      - name: Debug - listar FTP remoto
        run: |
          echo "=== RAIZ FTP ==="
          curl -s --list-only ftp://${{ secrets.FTP_SERVER }}/ --user "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" || echo "No se pudo listar raiz"
          echo "=== PWD ==="
          curl -s ftp://${{ secrets.FTP_SERVER }}/ --user "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" -Q "PWD" 2>&1 | grep '257' || echo "No se pudo obtener PWD"
          echo "=== public_html ==="
          curl -s --list-only ftp://${{ secrets.FTP_SERVER }}/public_html/ --user "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" || echo "No se pudo listar public_html/"
          echo "=== landing-flutter ==="
          curl -s --list-only ftp://${{ secrets.FTP_SERVER }}/public_html/landing-flutter/ --user "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" || echo "No se pudo listar landing-flutter/"
